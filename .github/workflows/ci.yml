name: CI Optimized

on:
  push:

jobs:
  test-shard-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run Test Shard 1
        run: npx jest --shard=1/2 --passWithNoTests   # ✅ moved here

  test-shard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run Test Shard 2
        run: npx jest --shard=2/2 --passWithNoTests   # ✅ moved here

  build-and-push:
    needs:
      - test-shard-1
      - test-shard-2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cicd-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ✅ No tests here — only build and push