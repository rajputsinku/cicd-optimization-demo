name: CI Optimized
on:
  push:

jobs:
  # ── JOB 1: Test Shard 1 ──
  test-shard-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                   # ✅ NPM caching built-in
      - run: npm ci
      - name: Run tests - shard 1
        run: npx jest --testPathPattern="index" --forceExit

  # ── JOB 2: Test Shard 2 (runs in parallel with shard 1) ──
  test-shard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                   # ✅ NPM caching built-in
      - run: npm ci
      - name: Run tests - shard 2
        run: npx jest --testPathPattern="health" --forceExit

  # ── JOB 3: Build & Push (only after both shards pass) ──
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-shard-1, test-shard-2]  # ✅ Parallel gate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cicd-demo:${{ github.sha }}
          cache-from: type=gha           # ✅ Docker layer caching
          cache-to: type=gha,mode=max